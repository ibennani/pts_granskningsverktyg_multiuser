server {
    listen 80;
    server_name ux-granskningsverktyg.pts.ad;

    # Redirect all HTTP requests to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ux-granskningsverktyg.pts.ad;

    root /var/www/ux-granskningsverktyg;
    index index.html index.htm;

    # Fullchain byggs och läggs i deploy-mappen för att undvika ofullständig cert-kedja i klienter.
    ssl_certificate /var/www/granskningsverktyget-v2/ssl/pts-ad-fullchain.crt;
    ssl_certificate_key /etc/nginx/ssl/privkey.key;

    ssl_protocols TLSv1.2;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Optional security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Omdirigera /v2 till /v2/ så att relativa länkar (t.ex. ./css/...) i index.html löses rätt
    location = /v2 {
        return 301 $scheme://$host/v2/$is_args$args;
    }

    # V2 API – MÅSTE komma före /v2/ så att DELETE/PUT/PATCH inte fångas av try_files
    # rewrite säkerställer att /v2/api/audits/123 -> /api/audits/123 (annars 404)
    location /v2/api {
        client_max_body_size 50m;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        rewrite ^/v2/api(.*)$ /api$1 break;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-User-Name $http_x_user_name;
    }

    # WebSocket för realtidssynkronisering (granskningar/regelfiler)
    # proxy_pass med /ws skickar anrop till backend som /ws (backend lyssnar på /ws)
    location /v2/ws {
        proxy_pass http://127.0.0.1:3000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # build-info.js – aldrig cache för versionskontroll
    location = /v2/build-info.js {
        alias /var/www/granskningsverktyget-v2/build-info.js;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
    }

    # Service worker och Workbox-filer – aldrig cache, annars kan SW uppdateras för sent (t.ex. "morgonen efter deploy").
    location = /v2/sw.js {
        alias /var/www/granskningsverktyget-v2/sw.js;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
    }

    location ~ ^/v2/(workbox-.*\.js)$ {
        alias /var/www/granskningsverktyget-v2/$1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
    }

    # index.html – aldrig cache, garanterar att vanlig refresh ger ny version efter deploy
    location = /v2/index.html {
        alias /var/www/granskningsverktyget-v2/index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
    }

    # V2 - ny version med backend
    # /v2/... -> /var/www/granskningsverktyget-v2/...
    location /v2/ {
        alias /var/www/granskningsverktyget-v2/;
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ /v2/index.html;
    }

    # Omdirigera /test-server till /test-server/
    location = /test-server {
        return 301 $scheme://$host/test-server/$is_args$args;
    }

    # Testserver API – separat backend på port 3001
    location /test-server/api {
        client_max_body_size 50m;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        rewrite ^/test-server/api(.*)$ /api$1 break;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-User-Name $http_x_user_name;
    }

    # WebSocket för testserver
    location /test-server/ws {
        proxy_pass http://127.0.0.1:3001/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /test-server/build-info.js {
        alias /var/www/granskningsverktyget-test-server/build-info.js;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
    }

    location = /test-server/sw.js {
        alias /var/www/granskningsverktyget-test-server/sw.js;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
    }

    location ~ ^/test-server/(workbox-.*\.js)$ {
        alias /var/www/granskningsverktyget-test-server/$1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
    }

    location = /test-server/index.html {
        alias /var/www/granskningsverktyget-test-server/index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
    }

    # Testserver – isolerad instans med egen databas och filer
    location /test-server/ {
        alias /var/www/granskningsverktyget-test-server/;
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ /test-server/index.html;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
