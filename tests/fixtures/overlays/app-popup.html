<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>App popup fixture</title></head>
<body>
<div role="dialog" aria-modal="true" class="app-popup" style="position:fixed;bottom:0;left:0;right:0;padding:1.5rem;background:#f5f5f5;z-index:7000;">
  <p>Download our app from the App Store or Google Play.</p>
  <button type="button">Get the app</button>
  <button type="button" id="dismiss">Not now</button>
</div>
<main><h1>Home</h1></main>
<script>
document.getElementById('dismiss').addEventListener('click', function () {
    document.querySelector('.app-popup').style.display = 'none';
});
</script>
</body>
</html>
