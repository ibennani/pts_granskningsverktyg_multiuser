<!DOCTYPE html>
<html lang="sv">
<head><meta charset="utf-8"><title>Nyhetsbrev fixture</title></head>
<body>
<div class="modal-backdrop" style="position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:9000;"></div>
<div role="dialog" aria-modal="true" class="newsletter-popup" style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:420px;padding:2rem;background:#fff;z-index:9001;">
  <h2>Skriv upp dig på vårt nyhetsbrev</h2>
  <p>Få erbjudanden och nyheter direkt i inkorgen.</p>
  <button type="button">Prenumerera</button>
  <button type="button" id="close" aria-label="Stäng">×</button>
</div>
<main><h1>Butik</h1></main>
<script>
document.getElementById('close').addEventListener('click', function () {
    document.querySelector('.modal-backdrop').style.display = 'none';
    document.querySelector('.newsletter-popup').style.display = 'none';
});
</script>
</body>
</html>
